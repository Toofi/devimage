name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Vérification des thèmes
        run: npm run themes:check

      - name: Tests unitaires
        run: npm test -- --watch=false

      - name: Build (base-href = nom du repo pour GitHub Pages)
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - name: Fallback SPA pour GitHub Pages
        run: cp dist/devimage/browser/index.html dist/devimage/browser/404.html

      - name: Upload artefact Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/devimage/browser

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
